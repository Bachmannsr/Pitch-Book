<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitchbook – Football Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --chalk:#f2f4ef; --turf:#1f5c3a; --light:#f5d547; --ink:#14211a; --line:#cbd5cc; --muted:#5b6a60; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Barlow',system-ui,sans-serif; background:var(--chalk); color:var(--ink); min-height:100vh; }
  a { color:inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--light); outline-offset:2px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:18px 28px; }
  .logo { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.6rem; color:var(--turf); text-decoration:none; }
  .login { font-weight:500; text-decoration:none; border:2px solid var(--ink); border-radius:999px; padding:8px 20px; }
  .login:hover { background:var(--ink); color:var(--chalk); }
  .subnav { display:flex; gap:8px; padding:0 28px 8px; overflow-x:auto; }
  .subnav a { text-decoration:none; font-weight:500; padding:6px 16px; border-radius:999px; border:2px solid transparent; white-space:nowrap; }
  .subnav a:hover { background:var(--light); }
  .subnav a.on { border-color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:8px 20px 60px; }
  main.wide { max-width:none; padding:0 0 60px; }
  h1.page { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:clamp(2.4rem,7vw,3.6rem); line-height:1; }
  h2 { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.7rem; margin:36px 0 14px; }
  .sub { margin-top:8px; color:var(--muted); }

  /* home */
  .hero { position:relative; overflow:hidden; background:var(--turf); color:var(--chalk); margin:0 28px; border-radius:20px; padding:72px 24px 80px; text-align:center; }
  .hero::before, .hero::after { content:""; position:absolute; pointer-events:none; }
  .hero::before { left:50%; top:0; bottom:0; width:2px; background:rgba(242,244,239,.18); }
  .hero::after { left:50%; top:50%; width:460px; height:460px; transform:translate(-50%,-50%); border:2px solid rgba(242,244,239,.18); border-radius:50%; }
  .hero > * { position:relative; z-index:1; }
  .hero h1 { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:clamp(2.6rem,8vw,5rem); line-height:1; }
  .hero .sub { color:inherit; opacity:.85; font-size:1.1rem; margin-top:12px; }
  .search { position:relative; max-width:620px; margin:32px auto 0; text-align:left; }
  .search input, .filter { width:100%; font:inherit; font-size:1.1rem; padding:16px 20px; border:3px solid transparent; border-radius:14px; background:var(--chalk); color:var(--ink); }
  .filter { border-color:var(--ink); margin:20px 0 8px; }
  .search input:focus { border-color:var(--light); outline:none; }
  .results { position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--chalk); color:var(--ink); border-radius:14px; overflow:hidden; list-style:none; padding:0; box-shadow:0 12px 30px rgba(0,0,0,.25); display:none; z-index:5; }
  .results.open { display:block; }
  .results a { display:flex; justify-content:space-between; gap:12px; padding:12px 22px; text-decoration:none; }
  .results a:hover, .results a:focus { background:var(--light); outline:none; }
  .results small, .results .empty { color:var(--muted); }
  .results .empty { padding:14px 22px; }
  .menu { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; max-width:960px; margin:40px auto; padding:0 28px; }
  .menu a { display:flex; flex-direction:column; justify-content:space-between; min-height:130px; padding:18px 20px; border:2px solid var(--ink); border-radius:14px; text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:2rem; }
  .menu a span { font-family:'Barlow',sans-serif; font-weight:400; font-size:.95rem; color:#4a5a50; }
  .menu a:hover, .menu a:focus-visible { background:var(--light); }
  .menu a.primary { background:var(--ink); color:var(--chalk); }
  .menu a.primary span { color:#b9c6bd; }
  .menu a.primary:hover { background:var(--light); color:var(--ink); }
  .menu a.primary:hover span { color:var(--ink); }

  /* lists (trending + players) */
  .tabs { display:flex; gap:8px; margin:24px 0 16px; }
  .tabs button { font:inherit; font-weight:500; cursor:pointer; padding:8px 18px; border:2px solid var(--ink); border-radius:999px; background:transparent; color:var(--ink); }
  .tabs button[aria-pressed="true"] { background:var(--ink); color:var(--chalk); }
  .tabs button:hover:not([aria-pressed="true"]) { background:var(--light); }
  ol, ul.rows { list-style:none; padding:0; }
  .rows a { display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:14px; padding:14px 8px; border-bottom:1px solid var(--line); text-decoration:none; }
  .rows a:hover, .rows a:focus-visible { background:var(--light); outline:none; }
  .rk { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:2rem; text-align:center; color:var(--turf); }
  .nm { font-weight:500; font-size:1.1rem; }
  .meta { color:var(--muted); font-size:.92rem; }
  .bar { display:block; height:6px; margin-top:8px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--turf); }
  .views { text-align:right; font-weight:500; }
  .views small { display:block; color:var(--muted); font-weight:400; }
  .empty-msg { padding:24px 8px; color:var(--muted); }

  /* profile */
  .head { display:flex; justify-content:space-between; align-items:center; gap:20px; background:var(--turf); color:var(--chalk); border-radius:20px; padding:32px; }
  .head h1 { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:clamp(2.4rem,7vw,4rem); line-height:1; }
  .head p { margin-top:8px; font-size:1.1rem; opacity:.9; }
  .rating { text-align:center; flex-shrink:0; }
  .rating b { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:clamp(4.5rem,16vw,8rem); line-height:.9; color:var(--light); }
  .rating span { font-size:.95rem; opacity:.85; }
  .facts { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px; }
  .fact { border:2px solid var(--ink); border-radius:14px; padding:14px 16px; }
  .fact b { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.9rem; line-height:1.1; }
  .fact span { color:var(--muted); font-size:.92rem; }
  .ranks { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .rank { background:var(--ink); color:var(--chalk); border-radius:14px; padding:18px; }
  .rank b { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:2.6rem; line-height:1; color:var(--light); }
  .ability { display:grid; grid-template-columns:minmax(240px,340px) 1fr; gap:28px; align-items:center; }
  .ability svg { width:100%; height:auto; }
  .stat { display:grid; grid-template-columns:100px 1fr 36px; align-items:center; gap:12px; padding:7px 0; }
  .stat .bar { height:10px; margin:0; border-radius:5px; }
  .stat b { text-align:right; }
  .back { display:inline-block; margin:4px 0 16px; color:var(--muted); }
  .note { color:var(--muted); margin-top:28px; font-size:.9rem; }

  .head p a { text-decoration:underline; text-underline-offset:3px; }
  .cgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:24px; }
  .ccard { display:flex; align-items:center; gap:16px; padding:16px; border:2px solid var(--ink); border-radius:14px; text-decoration:none; }
  .ccard:hover, .ccard:focus-visible { background:var(--light); outline:none; }
  .ccard b { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.4rem; }
  .chead { display:flex; align-items:center; gap:22px; }
  .chead h1 { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:clamp(2.2rem,7vw,3.6rem); line-height:1; }
  .chead p { margin-top:6px; color:var(--muted); font-size:1.1rem; }
  .badge { display:inline-block; margin-top:10px; background:var(--light); border-radius:999px; padding:4px 14px; font-weight:500; font-size:.95rem; }
  .cbox { margin-top:24px; border:2px solid var(--ink); border-radius:20px; padding:24px; }
  .cbox h2 { margin-top:28px; }
  .ratings { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .ovr b { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:6rem; line-height:.9; color:var(--turf); }
  .ovr span { color:var(--muted); }
  .lines { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; flex:1; min-width:240px; }
  .line { background:var(--ink); color:var(--chalk); border-radius:12px; padding:12px; text-align:center; }
  .line b { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:2rem; line-height:1; color:var(--light); }
  .pitch { position:relative; background:var(--turf); border-radius:16px; aspect-ratio:4/5; max-width:480px; margin:16px auto; overflow:hidden; }
  .pitch::before { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(242,244,239,.2); }
  .pitch::after { content:""; position:absolute; left:50%; top:50%; width:90px; height:90px; transform:translate(-50%,-50%); border:2px solid rgba(242,244,239,.2); border-radius:50%; }
  .dot { position:absolute; z-index:1; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; text-decoration:none; color:var(--chalk); }
  .dot b { width:38px; height:38px; border-radius:50%; background:var(--light); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.2rem; }
  .dot span { margin-top:3px; font-size:.75rem; font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,.6); white-space:nowrap; }
  .dot:hover b, .dot:focus-visible b { background:var(--chalk); outline:none; }
  .sqh, .sq a { display:grid; grid-template-columns:52px 1fr 40px 48px; align-items:center; gap:12px; padding:10px 8px; }
  .sqh { color:var(--muted); font-size:.85rem; border-bottom:2px solid var(--ink); margin-top:8px; }
  .sqh span:nth-child(n+3), .sq a > .meta { text-align:right; }
  .sq { list-style:none; padding:0; }
  .sq a { border-bottom:1px solid var(--line); text-decoration:none; }
  .sq a:hover, .sq a:focus-visible { background:var(--light); outline:none; }
  .sq .pos { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.1rem; color:var(--turf); }
  .sq b { text-align:right; font-family:'Barlow Condensed',sans-serif; font-size:1.4rem; }
  @media (max-width:640px) { .chead { gap:14px; } .cbox { padding:16px; } .ovr b { font-size:5rem; } }

  .flag { font-size:4rem; line-height:1; flex-shrink:0; }
  .ccard .flag { font-size:2.6rem; }
  .btn { display:inline-block; font:inherit; font-weight:500; cursor:pointer; text-decoration:none; background:var(--ink); color:var(--chalk); border:2px solid var(--ink); border-radius:999px; padding:10px 22px; }
  .btn:hover { background:var(--light); color:var(--ink); }
  .btn.ghost { background:transparent; color:var(--ink); }
  .toprow { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .authform { display:grid; gap:14px; margin-top:16px; max-width:420px; }
  .eform { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:20px; }
  .eform h2 { margin:14px 0 0; }
  .fld { display:flex; flex-direction:column; gap:6px; font-weight:500; }
  .fld input, .fld select { font:inherit; padding:12px 14px; border:2px solid var(--ink); border-radius:12px; background:var(--chalk); color:var(--ink); }
  .fld input[type=color] { padding:4px; height:48px; }
  .wide { grid-column:1 / -1; }
  .err { color:#a3261c; min-height:1.3em; font-weight:500; }
  .acts { display:flex; gap:10px; flex-wrap:wrap; }
  .colr { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .colr input[type=color] { width:56px; }
  .sw { display:flex; gap:6px; flex-wrap:wrap; }
  .swb { width:28px; height:28px; border-radius:50%; border:2px solid var(--ink); cursor:pointer; padding:0; }
  .prev { display:flex; justify-content:center; padding:16px; border:2px dashed var(--line); border-radius:14px; }
  a.rank { display:block; text-decoration:none; }
  a.rank:hover, a.rank:focus-visible { background:var(--turf); outline:none; }
  .rank small { display:block; margin-top:8px; opacity:.7; font-size:.85rem; }
  .rows li.me a { background:var(--light); }
  .tabs { flex-wrap:wrap; }
  .tabs a { font:inherit; font-weight:500; text-decoration:none; padding:8px 18px; border:2px solid var(--ink); border-radius:999px; color:var(--ink); }
  .tabs a[aria-current="page"] { background:var(--ink); color:var(--chalk); }
  .tabs a:hover:not([aria-current="page"]) { background:var(--light); }
  .lgh, .lg a { display:grid; grid-template-columns:1fr 64px 72px; align-items:center; gap:12px; padding:14px 8px; }
  .lgh { color:var(--muted); font-size:.85rem; border-bottom:2px solid var(--ink); margin-top:20px; }
  .lgh span:nth-child(n+2), .lg b { text-align:right; }
  .lg { list-style:none; padding:0; }
  .lg a { border-bottom:1px solid var(--line); text-decoration:none; }
  .lg a:hover, .lg a:focus-visible { background:var(--light); outline:none; }
  .lg b { font-family:'Barlow Condensed',sans-serif; font-size:1.6rem; }
  .chead p a { text-decoration:underline; text-underline-offset:3px; }
  @media (max-width:640px) {
    .topbar { padding:14px 16px; } .subnav { padding:0 16px 8px; }
    .hero { margin:0 12px; padding:48px 16px 56px; } .hero::after { width:300px; height:300px; }
    .head { padding:24px 20px; } .facts { grid-template-columns:repeat(2,1fr); }
    .ranks, .ability { grid-template-columns:1fr; }
    .rows a { grid-template-columns:36px 1fr auto; gap:10px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="#/">Pitchbook</a>
  <a class="login" id="auth" href="#/login">Log in</a>
</header>
<nav class="subnav" id="subnav" aria-label="Browse"></nav>
<main id="app"></main>

<script>
  // SAMPLE DATA – replace with calls to your own database/API.
  const STATS = ['Pace','Shooting','Passing','Dribbling','Defending','Physical'];
  const GK_STATS = ['Diving','Handling','Kicking','Reflexes','Speed','Positioning'];
  const players = [];

  const clubs = [];
  const PLURAL = { GK:'goalkeepers', LB:'left backs', LWB:'left wing backs', CB:'centre backs', RB:'right backs', RWB:'right wing backs', CDM:'defensive midfielders', CM:'central midfielders', CAM:'attacking midfielders', LM:'left midfielders', RM:'right midfielders', LW:'left wingers', RW:'right wingers', CF:'centre forwards', ST:'strikers' };
  const CODE = Object.fromEntries(Object.entries(PLURAL).map(([k, v]) => [v, k]));
  players.forEach(p => p.code = CODE[p.pos]);
  // Typical stats per position (same order as the stat sets) and how much each stat counts towards the overall rating.
  const BASE = { GK:[70,70,66,72,52,72], LB:[78,50,68,68,72,70], RB:[78,50,68,68,72,70], CB:[58,40,56,52,78,80], CM:[68,66,78,74,64,70], LW:[82,70,70,80,35,64], RW:[82,70,70,80,35,64], ST:[78,82,62,74,35,76],
    CDM:[62,50,74,64,80,78], CAM:[72,76,82,84,50,58], LM:[82,68,76,80,50,64], RM:[82,68,76,80,50,64], LWB:[82,52,72,72,74,72], RWB:[82,52,72,72,74,72], CF:[76,80,76,80,40,72] };
  const WEIGHT = { GK:[4,4,1,4,0,3], LB:[3,0,2,2,4,2], RB:[3,0,2,2,4,2], CB:[1,0,1,0,5,4], CM:[1,2,4,3,2,2], LW:[3,2,2,4,0,1], RW:[3,2,2,4,0,1], ST:[2,4,1,2,0,2],
    CDM:[1,0,3,1,5,4], CAM:[2,3,4,4,0,1], LM:[3,2,3,4,1,1], RM:[3,2,3,4,1,1], LWB:[4,0,3,2,3,2], RWB:[4,0,3,2,3,2], CF:[2,4,3,3,0,2] };
  // 4-3-3: position code, then x% and y% on the pitch graphic
  const SLOTS = [['GK',50,90],['RB',86,68],['CB',62,73],['CB',38,73],['LB',14,68],['CM',70,48],['CM',50,54],['CM',30,48],['RW',84,22],['ST',50,14],['LW',16,22]];
  const avg = a => Math.round(a.reduce((s, p) => s + p.rating, 0) / a.length);

  // Nations are built from the existing players only (no extra players are generated).
  const FLAGS = { England:'ENG', Spain:'ES', France:'FR', Brazil:'BR', Germany:'DE', Portugal:'PT', Japan:'JP', Mexico:'MX', Argentina:'AR', Italy:'IT', Netherlands:'NL', Belgium:'BE', Croatia:'HR', Nigeria:'NG', USA:'US', Senegal:'SN', Morocco:'MA', 'South Korea':'KR', Colombia:'CO', Uruguay:'UY', Ghana:'GH', Denmark:'DK', Sweden:'SE', Norway:'NO', Poland:'PL', Turkey:'TR', Switzerland:'CH', Canada:'CA', Australia:'AU', Egypt:'EG', Ireland:'IE', Scotland:'SCO', Jamaica:'JM', Nepal:'NP', Mali:'ML', Somalia:'SO', Cameroon:'CM', China:'CN', Tunisia:'TN' };
  const TAGS = { ENG:'gbeng', SCO:'gbsct', WAL:'gbwls' };
  const flagOf = k => TAGS[k] ? String.fromCodePoint(0x1F3F4, ...[...TAGS[k]].map(ch => 0xE0000 + ch.charCodeAt(0)), 0xE007F)
                              : String.fromCodePoint(...[...k].map(ch => 127397 + ch.charCodeAt(0)));
  const GROUP = { GK:'g', LB:'d', LWB:'d', CB:'d', RB:'d', RWB:'d', CDM:'m', CM:'m', CAM:'m', LM:'m', RM:'m', LW:'a', RW:'a', CF:'a', ST:'a' };
  let nations = [];
  const pickXI = (squad, slots = SLOTS) => {
    const used = new Set(), xi = slots.map(() => null);
    // First fill each slot with the best player in that exact position, then with the best left in the same area of the pitch
    [(q, s) => q.code === s[0], (q, s) => GROUP[q.code] === GROUP[s[0]]].forEach(match => slots.forEach((s, i) => {
      if (xi[i]) return;
      const p = squad.filter(q => !used.has(q.id) && match(q, s)).sort((a, b) => b.rating - a.rating)[0];
      if (p) { xi[i] = p; used.add(p.id); }
    }));
    return xi;
  };
  const teamStats = (t, xi) => {
    const got = xi.filter(Boolean), line = codes => { const g = got.filter(p => codes.includes(p.code)); return g.length ? avg(g) : null; };
    Object.assign(t, { xi, n: got.length, ovr: got.length ? avg(got) : null, att: line(['RW','ST','LW','CF']), mid: line(['CDM','CM','CAM','LM','RM']), def: line(['GK','RB','CB','LB','LWB','RWB']) });
  };
  // Works out every club's and nation's squad and ratings from the players. Runs at start-up and after any admin edit.
  function rebuild() {
    players.forEach(p => { const c = clubs.find(x => x.name === p.club); p.league = c ? c.league : ''; });
    clubs.forEach(c => { c.squad = players.filter(p => p.club === c.name); teamStats(c, pickXI(c.squad, FORMS[c.formation] || SLOTS)); if (c.rating) c.ovr = c.rating; });
    nations = [...new Set(players.map(p => p.nation))].map(name => {
      const n = { id: name.toLowerCase(), name, flag: FLAGS[name] ? flagOf(FLAGS[name]) : '\u{1F3F3}\u{FE0F}', squad: players.filter(p => p.nation === name) };
      teamStats(n, pickXI(n.squad)); return n;
    });
  }

  // Clubs added after the prototype ones. They start with no players: squads arrive with the team sheets.
  // Until a club has 11 players, its overall rating is the figure set here.
  const LEAGUE = { England:'English Premier Division', Germany:'German Premier Division', Italy:'Italian Premier Division', France:'French Premier Division', Spain:'Spanish Premier Division', Brazil:'Brazilian Premier Division', Portugal:'Portuguese Premier Division', USA:'American Premier Division' };
  // [country, name, crest letters, overall, shape, background, pattern, pattern colour, border, emblem, emblem colour, stars]
  [
    ['England','London City Gunners','LCG',85,'shield','#c8102e','none','#c8102e','#ffffff','text','#ffffff',0],
    ['England','Chelski','CHE',81,'round','#1a3fa0','hoops','#2a56c6','#ffffff','text','#ffffff',0],
    ['England','Liverpool City','LCI',83,'rounded','#c8102e','chevron','#9b0d24','#f5d547','text','#f5d547',0],
    ['England','City of Manchester FC','CMC',84,'hexagon','#6cabdd','none','#6cabdd','#ffffff','star','#ffffff',0],
    ['Germany','Bavaria Munich','BAV',86,'round','#dc052d','stripes','#c00428','#0066b2','text','#ffffff',5],
    ['Germany','Berserk Dortmund','BER',82,'round','#fde100','none','#fde100','#000000','text','#000000',0],
    ['Italy','Piedmont','PIE',79,'shield','#ffffff','stripes','#000000','#000000','star','#f5d547',2],
    ['Italy','Inter Malicia','IM',81,'rounded','#0b3c8a','stripes','#000000','#ffffff','text','#ffffff',2],
    ['Italy','AC Malicia','ACM',77,'rounded','#c8102e','stripes','#000000','#ffffff','text','#ffffff',0],
    ['Italy','Rome FC','ROM',78,'shield','#8c1d40','none','#8c1d40','#f5b700','text','#f5b700',0],

        const list = store.get('pb_users', []), found = list.find(x => x.name.toLowerCase() === name.toLowerCase());

          if (name.length < 3) { err.textContent = 'Your name needs at least 3 characters.'; return; }

      const orig = clone(origPlayers.get(p.id)), entry = [...origClubs].find(([, o]) => o.name === orig.club), cur = entry && clubs.find(c => c.id === entry[0]);
      Object.assign(p, orig, { club: cur ? cur.name : 'Free agent' }); rebuild(); persist(); location.hash = '#/player/' + p.id;
    });
    const del = document.getElementById('del');
    if (del) sure(del, () => { players.splice(players.indexOf(p), 1); rebuild(); persist(); location.hash = '#/players'; });
  }

  function editClub(id) {
    if (!isAdmin()) return adminOnly();
    app.className = '';
    const isNew = id === 'new';
    const c = isNew ? { name: '', country: 'England', founded: null, comp: '', league: clubs[0] ? clubs[0].league : 'Meridian League',
                        crest: { shape:'shield', base:'#1f5c3a', pattern:'none', patColor:'#153f28', trim:'#f5d547', emblem:'text', emblemColor:'#f5d547', text:'', stars:0 } }
                    : clubs.find(x => String(x.id) === String(id));
    if (!c) return notFound('club', '#/clubs');
    const cr = c.crest;
    const txt = (n, l, v, extra = '') => `<label class="fld"><span>${l}</span><input name="${n}" value="${esc(v)}" maxlength="40" ${extra}></label>`;
    const sel = (n, l, o, cur) => `<label class="fld"><span>${l}</span><select name="${n}">${o.map(([v, t]) => opt(v, cur, t)).join('')}</select></label>`;
    const pick = (n, l, v) => `<div class="fld wide"><span>${l}</span><div class="colr"><input name="${n}" type="color" value="${v}" aria-label="${l}"><span class="sw">${PALETTE.map(h => `<button type="button" class="swb" data-t="${n}" data-c="${h}" style="background:${h}" aria-label="${h}"></button>`).join('')}</span></div></div>`;
    app.innerHTML = `
      <a class="back" href="${isNew ? '#/clubs' : '#/club/' + c.id}">‹ Cancel</a>
      <h1 class="page">${isNew ? 'Add club' : 'Edit club'}</h1>
      <form class="eform" id="ef">
        ${txt('name', 'Club name', c.name, 'required')}${txt('country', 'Country', c.country, 'required')}
        <label class="fld"><span>Founded (optional)</span><input name="founded" type="number" step="1" min="1800" max="2026" value="${c.founded ?? ''}"></label>
        <label class="fld"><span>League</span><input name="league" value="${esc(c.league)}" maxlength="40" list="lg" required></label>
        <datalist id="lg">${[...new Set(clubs.map(x => x.league))].map(l => `<option value="${esc(l)}">`).join('')}</datalist>
        ${sel('formation', 'Formation', Object.keys(FORMS).map(k => [k, k]), c.formation || '4-3-3')}
        <label class="fld"><span>Overall rating (leave blank to work it out from the Starting 11)</span><input name="rating" type="number" step="1" min="1" max="99" value="${c.rating ?? ''}"></label>
        <label class="fld wide"><span>European competition (leave blank if none)</span><input name="comp" value="${esc(c.comp)}" maxlength="40"></label>
        <h2 class="wide">Crest</h2>
        <div class="prev wide" id="prev"></div>
        ${sel('shape', 'Shape', [['shield','Shield'],['round','Round'],['rounded','Rounded square'],['hexagon','Hexagon'],['diamond','Diamond'],['banner','Banner']], cr.shape)}
        ${sel('pattern', 'Pattern', [['none','Plain'],['stripes','Stripes'],['hoops','Hoops'],['halves','Halves'],['diagonal','Sash'],['chevron','Chevron']], cr.pattern)}
        ${sel('emblem', 'Emblem', [['text','Letters'],['star','Star'],['ball','Ball'],['crown','Crown'],['bolt','Bolt'],['none','None']], cr.emblem)}
        <label class="fld"><span>Letters (up to 3, blank = initials)</span><input name="text" value="${esc(cr.text)}" maxlength="3"></label>
        ${sel('stars', 'Stars above emblem', [0, 1, 2, 3, 4, 5].map(n => [String(n), String(n)]), String(cr.stars))}
        ${pick('base', 'Background colour', cr.base)}${pick('patColor', 'Pattern colour', cr.patColor)}${pick('trim', 'Border colour', cr.trim)}${pick('emblemColor', 'Emblem and stars colour', cr.emblemColor)}
        <p class="err wide" id="err" role="alert"></p>
        <div class="acts wide"><button class="btn" type="submit">${isNew ? 'Add club' : 'Save changes'}</button>
          ${!isNew && origClubs.has(c.id) ? '<button class="btn ghost" type="button" id="reset">Reset to original</button>' : ''}
          ${isNew ? '' : '<button class="btn ghost" type="button" id="del">Delete club</button>'}</div>
      </form>`;
    const f = document.getElementById('ef'), err = document.getElementById('err'), prev = document.getElementById('prev');
    const readCrest = () => ({ shape: f.shape.value, pattern: f.pattern.value, emblem: f.emblem.value, text: f.text.value.trim().slice(0, 3), stars: +f.stars.value,
                               base: f.base.value, patColor: f.patColor.value, trim: f.trim.value, emblemColor: f.emblemColor.value });
    const upd = () => { prev.innerHTML = crestSvg(readCrest(), 120, f.name.value); };
    f.addEventListener('input', upd); f.addEventListener('change', upd);
    f.addEventListener('click', e => { const b = e.target.closest('.swb'); if (b) { f[b.dataset.t].value = b.dataset.c; upd(); } });
    upd();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const g = n => f[n].value.trim(), o = { name: g('name'), country: g('country'), founded: g('founded') ? +g('founded') : null, rating: g('rating') ? +g('rating') : null, formation: g('formation'), comp: g('comp'), league: g('league'), crest: readCrest() };
      if (!o.name || !o.country || !o.league) { err.textContent = 'Name, country and league can’t be blank.'; return; }
      if (o.name.toLowerCase() === 'free agent' || clubs.some(x => x !== c && x.name.toLowerCase() === o.name.toLowerCase())) { err.textContent = 'Another club already uses that name. Try a different one.'; return; }
      let t = c;
      if (isNew) { t = { id: Math.max(0, ...clubs.map(x => x.id)) + 1 }; clubs.push(t); } else renameClub(c.name, o.name);
      Object.assign(t, o); rebuild();
      if (!persist()) { err.textContent = 'Your changes show now, but couldn’t be saved on this device, so they’ll be lost on refresh.'; return; }
      location.hash = '#/club/' + t.id;
    });
    const reset = document.getElementById('reset');
    if (reset) reset.addEventListener('click', () => {
      const o = clone(origClubs.get(c.id)); renameClub(c.name, o.name); Object.assign(c, o); rebuild(); persist(); location.hash = '#/club/' + c.id;
    });
    const del = document.getElementById('del');
    if (del) sure(del, () => { renameClub(c.name, 'Free agent'); clubs.splice(clubs.indexOf(c), 1); rebuild(); persist(); location.hash = '#/clubs'; });
  }

  // Full ranking list behind each box on a player's profile (by position, by league, or global)
  function rankingPage(kind, key, pid) {
    app.className = '';
    key = key ? decodeURIComponent(key) : '';
    const me = pid ? players.find(x => String(x.id) === String(pid)) : null;
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    const filters = { pos: [cap(PLURAL[key] || ''), p => p.code === key], league: [key, p => p.league === key], global: ['Global ranking', () => true] };
    const f = filters[kind];
    if (!f || (kind === 'pos' && !PLURAL[key]) || (kind === 'league' && !key)) { app.innerHTML = '<p class="empty-msg">We couldn’t find that ranking. <a href="#/players">Browse all players</a>.</p>'; return; }
    const list = players.filter(f[1]).sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name));
    const rankOf = p => list.filter(q => q.rating > p.rating).length + 1;
    const tabs = me ? [['pos', cap(PLURAL[me.code]), me.code], ...(me.league ? [['league', me.league, me.league]] : []), ['global', 'Global', 'all']]
      .map(([k, l, v]) => `<a href="#/ranking/${k}/${encodeURIComponent(v)}/${me.id}"${k === kind ? ' aria-current="page"' : ''}>${esc(l)}</a>`).join('') : '';
    app.innerHTML = `
      ${me ? `<a class="back" href="#/player/${me.id}">‹ ${esc(me.name)}</a>` : '<a class="back" href="#/players">‹ All players</a>'}
      <h1 class="page">${esc(f[0])}</h1>
      <p class="sub">Ranked by overall rating · ${list.length} player${list.length === 1 ? '' : 's'}</p>
      ${tabs ? `<div class="tabs" role="navigation" aria-label="Ranking type">${tabs}</div>` : ''}
      <ol class="rows">${list.map(p => `
        <li${me && p.id === me.id ? ' class="me"' : ''}><a href="#/player/${p.id}">
          <span class="rk">${rankOf(p)}</span>
          <span><span class="nm">${esc(p.name)}</span><br><span class="meta">${esc(p.club)} · ${esc(p.nation)}${kind === 'pos' ? '' : ' · ' + p.code}</span></span>
          <span class="views">${p.rating}<small>overall</small></span>
        </a></li>`).join('')}</ol>`;
    const row = app.querySelector('li.me');
    if (row) setTimeout(() => row.scrollIntoView({ block: 'center' }), 0);
  }

  // Leagues are worked out from the clubs. A league's country is the one most of its clubs come from.
  function allLeagues() {
    const m = new Map();
    clubs.forEach(c => {
      if (!c.league) return;
      const l = m.get(c.league) || { name: c.league, clubs: [], countries: {} };
      l.clubs.push(c); l.countries[c.country] = (l.countries[c.country] || 0) + 1; m.set(c.league, l);
    });
    return [...m.values()].map(l => ({ ...l, country: Object.entries(l.countries).sort((a, b) => b[1] - a[1])[0][0], players: players.filter(p => p.league === l.name).length }));
  }

  function leaguesPage() {
    app.className = '';
    const list = allLeagues().sort((a, b) => a.country.localeCompare(b.country) || a.name.localeCompare(b.name));
    app.innerHTML = `<h1 class="page">Leagues</h1><p class="sub">Select a league to see its teams.</p>
      ${list.length ? `<div class="lgh"><span>League</span><span>Teams</span><span>Players</span></div>
      <ul class="lg">${list.map(l => `<li><a href="#/league/${encodeURIComponent(l.name)}"><span><span class="nm">${esc(l.name)}</span><br><span class="meta">${esc(l.country)}</span></span><b>${l.clubs.length}</b><b>${l.players}</b></a></li>`).join('')}</ul>`
      : '<p class="empty-msg">No leagues yet. Add a club and give it a league.</p>'}`;
  }

  function leaguePage(key) {
    app.className = '';
    const l = allLeagues().find(x => x.name === (key ? decodeURIComponent(key) : ''));
    if (!l) { app.innerHTML = '<p class="empty-msg">We couldn’t find that league. <a href="#/leagues">Browse all leagues</a>.</p>'; return; }
    const teams = [...l.clubs].sort((a, b) => (b.ovr ?? -1) - (a.ovr ?? -1) || a.name.localeCompare(b.name));
    const rankOf = c => teams.filter(q => (q.ovr ?? -1) > (c.ovr ?? -1)).length + 1;
    document.title = l.name + ' – Pitchbook';
    app.innerHTML = `
      <a class="back" href="#/leagues">‹ All leagues</a>
      <h1 class="page">${esc(l.name)}</h1><p class="sub">${esc(l.country)}</p>
      <section class="facts" style="grid-template-columns:repeat(2,1fr);max-width:420px">
        <div class="fact"><b>${l.clubs.length}</b><span>Teams</span></div><div class="fact"><b>${l.players}</b><span>Players</span></div></section>
      <h2>Teams</h2><p class="sub" style="margin:0 0 8px">Ranked by overall rating</p>
      <ol class="rows">${teams.map(c => `
        <li><a href="#/club/${c.id}"><span class="rk">${rankOf(c)}</span>
          <span style="display:flex;align-items:center;gap:12px">${logo(c, 30)}<span><span class="nm">${esc(c.name)}</span><br><span class="meta">${c.squad.length} player${c.squad.length === 1 ? '' : 's'}</span></span></span>
          <span class="views">${c.ovr ?? '–'}<small>overall</small></span></a></li>`).join('')}</ol>`;
  }

  function soon(name) {
    app.className = '';
    app.innerHTML = `<h1 class="page">${esc(name)}</h1><p class="sub">This page hasn’t been built yet. <a href="#/">Back to home</a>.</p>`;
  }

  function route() {
    const [page, arg, arg2, arg3] = (location.hash.slice(1) || '/').split('/').filter(Boolean);
    renderAuth();
    document.title = 'Pitchbook – Football Database';
    subnav.innerHTML = page ? [['trending','Trending'],['players','Players'],['clubs','Clubs'],['leagues','Leagues'],['nations','Nations']]
      .map(([k, l]) => `<a href="#/${k}" class="${page === k || (page === 'player' && k === 'players') || (page === 'club' && k === 'clubs') || (page === 'nation' && k === 'nations') || (page === 'league' && k === 'leagues') ? 'on' : ''}">${l}</a>`).join('') : '';
    if (!page) home();
    else if (page === 'trending') trending();
    else if (page === 'players') playersPage();
    else if (page === 'player') profile(arg);
    else if (page === 'clubs') clubsPage();
    else if (page === 'club') clubPage(arg);
    else if (page === 'nations') nationsPage();
    else if (page === 'nation') nationPage(arg);
    else if (page === 'login') loginPage();
    else if (page === 'edit') (arg === 'club' ? editClub(arg2) : editPlayer(arg2));
    else if (page === 'ranking') rankingPage(arg, arg2, arg3);
    else if (page === 'leagues') leaguesPage();
    else if (page === 'league') leaguePage(arg);
    else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', e => { if (!e.target.closest('.search')) { const l = document.getElementById('results'); if (l) l.classList.remove('open'); } });
  route();
</script>
</body>
</html>
